<div th:fragment="main">
    <div class="lesson-card">

        <!-- Heading row -->
        <div class="form-heading-row">
            <h2>Create Lesson</h2>
            <span class="points-badge">Points</span>
        </div>

        <!-- Error banner -->
        <div th:if="${errorMessage}" class="lesson-error">
            ⚠️ <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/lessons/create}" th:object="${lesson}" method="post" novalidate>

            <!-- Lesson Name -->
            <div class="form-group">
                <label for="title">Lesson name</label>
                <input id="title" type="text" th:field="*{title}" placeholder="Enter lesson title" minlength="5"
                    maxlength="100" required oninput="updateCounter(this,'titleCount',100)">
                <div style="display:flex;justify-content:space-between;margin-top:4px;">
                    <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"
                        style="color:#b91c1c;font-size:0.8rem;"></span>
                    <span style="font-size:0.75rem;color:#4a6a8a;margin-left:auto;">
                        <span id="titleCount">0</span>/100
                    </span>
                </div>
            </div>

            <!-- Lesson Content -->
            <div class="form-group">
                <label for="content">Lesson content</label>
                <textarea id="content" th:field="*{content}" placeholder="Write the lesson content here…" rows="9"
                    minlength="20" required></textarea>
                <span th:if="${#fields.hasErrors('content')}" th:errors="*{content}"
                    style="color:#b91c1c;font-size:0.8rem;display:block;margin-top:4px;"></span>
            </div>

            <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
                <button type="submit" class="btn-green">Create Content</button>
                <a href="/lessons/list" class="lesson-back-link">Cancel</a>
            </div>
        </form>

        <span class="robot-icon">🤖</span>
    </div>

    <script>
        function updateCounter(input, counterId, max) {
            const count = input.value.length;
            const el = document.getElementById(counterId);
            if (el) {
                el.textContent = count;
                el.style.color = count > max * 0.9 ? '#b91c1c' : '';
            }
        }
        const titleInput = document.getElementById('title');
        if (titleInput) updateCounter(titleInput, 'titleCount', 100);
    </script>
</div>
