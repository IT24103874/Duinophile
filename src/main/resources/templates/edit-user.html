<div th:fragment="main">
    <div style="max-width: 500px; margin: 2rem auto;">
        <div class="form-card">
            <h2 style="color:var(--navy); margin-bottom:1.5rem;">Edit Profile</h2>
            <form th:action="@{/users/update/{id}(id=${user.id})}" th:object="${user}" method="post">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" th:field="*{username}" readonly>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red; font-size:0.85rem; margin-top:0.25rem;"></div>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}">
                </div>
                <div class="form-group">
                    <label>New Password (Optional)</label>
                    <input type="password" th:field="*{password}" placeholder="Leave blank to keep current">
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red; font-size:0.85rem; margin-top:0.25rem;"></div>
                </div>
                <div style="display:flex; gap:0.75rem;">
                    <button type="submit" class="btn">Update Profile</button>
                    <a th:href="@{/users/profile/{id}(id=${user.id})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>

        <div class="form-card" style="margin-top:2rem; border:1px solid #ffcdd2; background:#fff5f5;">
            <h3 style="color:#d32f2f; margin-bottom:1rem;">Danger Zone</h3>
            <p style="color:#5f6368; font-size:0.9rem; margin-bottom:1rem;">Once you delete your account, there is no going back. Please be certain.</p>
            <div th:if="${param.error}" style="color:#d32f2f; background:#ffebee; padding:0.75rem; border-radius:5px; margin-bottom:1rem; font-size:0.9rem; border:1px solid #ffcdd2;" th:text="${param.error}"></div>
            <form th:action="@{/users/delete-account}" method="post" onsubmit="return confirm('Are you absolutely sure you want to delete your account? This action cannot be undone.');">
                <div class="form-group">
                    <label style="color:#d32f2f; font-weight:600;">Confirm Password to Delete Account</label>
                    <input type="password" name="confirmDeletePassword" required placeholder="Enter your current password">
                </div>
                <button type="submit" class="btn" style="background:#d32f2f; color:white; width:100%;">Permanently Delete Account</button>
            </form>
        </div>
    </div>
</div>
