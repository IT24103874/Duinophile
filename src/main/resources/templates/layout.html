<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duinophile - Learning Platform</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- SweetAlert2 for beautiful alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <nav>
        <a th:href="@{/}" class="logo" style="text-decoration:none;">DUINOPHILE</a>
        <ul class="nav-links">
            <li th:if="${currentUser != null}"><a th:href="@{/courses/list}"
                    style="color:var(--navy); font-weight:700;">Courses</a></li>
            <li th:if="${currentUser != null and currentUser.role == 'USER'}"><a th:href="@{/courses/my}"
                    style="color:var(--navy); font-weight:700;">My Courses</a></li>
            <li th:if="${currentUser != null and currentUser.role == 'USER'}"><a th:href="@{/posts/feed}"
                    style="color:var(--navy); font-weight:700;">Feed</a></li>

            <li th:if="${currentUser != null and currentUser.role != 'ADMIN'}">
                <a th:href="@{/users/profile/{id}(id=${currentUser.id})}"
                    style="color:var(--navy); font-weight:700;">Profile</a>
            </li>
            <li th:if="${currentUser != null and currentUser.role == 'USER'}">
                <a th:href="@{/reports/my-reports}" style="color:var(--navy); font-weight:700;">My Reports</a>
            </li>

            <!-- Admin/Staff Community Management -->
            <li th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}">
                <a th:href="@{/posts/manage}" style="color:var(--navy); font-weight:700;">Manage Feed</a>
            </li>
            <li th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}">
                <a th:href="@{/feedback/manage}" style="color:var(--navy); font-weight:700;">Manage Reviews</a>
            </li>
            <li th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}">
                <a th:href="@{/reports/manage}" style="color:var(--navy); font-weight:700;">Manage Reports</a>
            </li>

            <!-- Admin-only Dashboard Link -->
            <li th:if="${currentUser != null and currentUser.role == 'ADMIN'}">
                <a th:href="@{/admin/dashboard}"
                    style="background:var(--navy); color:var(--yellow); border-radius:6px; padding:0.4rem 0.85rem; font-weight:700;">
                    ⚙️ Admin
                </a>
            </li>

            <!-- Logged-in items -->
            <li th:if="${currentUser != null}">
                <a th:href="@{/users/logout}" class="btn btn-sm"
                    style="background:var(--yellow); color:var(--navy); border:2.5px solid var(--navy); border-radius:10px; font-weight:700; padding: 0.5rem 1.25rem;">Log
                    out</a>
            </li>

            <!-- Logged-out items -->
            <li th:if="${currentUser == null}"><a th:href="@{/users/login}">Log in</a></li>
            <li th:if="${currentUser == null}"><a th:href="@{/users/register}" class="btn btn-sm"
                    style="color: white; background: var(--navy);">Sign up</a></li>
        </ul>
    </nav>

    <div class="container">
        <main th:insert="~{__${view}__ :: main}"></main>
    </div>

    <!-- Chatbot Widget -->
    <div id="chatbot-widget">
        <button id="chatbot-toggle" title="Ask DuinoBot AI">🤖</button>
        <div id="chatbot-window" style="display:none; flex-direction:column;">
            <div
                style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.75rem; border-bottom:2px solid #e5e7eb; padding-bottom:0.75rem;">
                <span style="font-size:1.4rem;">🤖</span>
                <strong style="color:var(--navy); font-size:0.95rem;">DuinoBot AI</strong>
            </div>
            <div id="chat-messages">
                <div class="chat-bot-msg">Hello! I'm your AI tutor. How can I help? 👋</div>
            </div>
            <div style="display:flex; gap:0.5rem;">
                <input type="text" id="chat-input" placeholder="Ask a question..." style="flex:1; font-size:0.85rem;">
                <button id="chat-send" class="btn btn-sm">Send</button>
            </div>
        </div>
    </div>

    <!-- Global Flash Message Handler -->
    <th:block th:if="${error}">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops!',
                    text: /*[[${error}]]*/ '',
                    confirmButtonColor: '#1e3c72'
                });
            });
        </script>
    </th:block>
    <th:block th:if="${success}">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                Swal.fire({
                    icon: 'success',
                    title: 'Success!',
                    text: /*[[${success}]]*/ '',
                    confirmButtonColor: '#1e3c72'
                });
            });
        </script>
    </th:block>

    <script>
        // Global delete confirmation
        function confirmDelete(event, message) {
            event.preventDefault();
            const form = event.target.closest('form');
            if (!form) return;
            Swal.fire({
                title: 'Are you sure?',
                text: message,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e53e3e',
                cancelButtonColor: '#718096',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        }

        const toggle = document.getElementById('chatbot-toggle');
        const windowDiv = document.getElementById('chatbot-window');
        const input = document.getElementById('chat-input');
        const send = document.getElementById('chat-send');
        const messages = document.getElementById('chat-messages');

        toggle.onclick = () => {
            const isOpen = windowDiv.style.display === 'flex';
            windowDiv.style.display = isOpen ? 'none' : 'flex';
        };

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'chat-user-msg';
            userMsg.textContent = text;
            messages.appendChild(userMsg);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            try {
                const response = await fetch('/api/chatbot/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                const botMsg = document.createElement('div');
                botMsg.className = 'chat-bot-msg';
                botMsg.textContent = data.reply;
                messages.appendChild(botMsg);
            } catch {
                const errMsg = document.createElement('div');
                errMsg.className = 'chat-bot-msg';
                errMsg.textContent = 'Sorry, something went wrong.';
                messages.appendChild(errMsg);
            }
            messages.scrollTop = messages.scrollHeight;
        }

        send.onclick = sendMessage;
        input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>

</html>
